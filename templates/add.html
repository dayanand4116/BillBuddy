
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add Bill | BillBuddy</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .bill-form {
            max-width: 650px;
            margin: 25px auto;
            padding: 28px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 20px #0f172a12;
        }
        .bill-form label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #334155;
        }
        .bill-form input,
        .bill-form select,
        .bill-form textarea {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font: inherit;
        }
        .bill-form button {
            margin-top: 22px;
            padding: 12px 20px;
            background: #4338ca;
        }
    </style>
</head>
<body>
    <h1>BillBuddy</h1>
    <p>Add a new bill to track your expenses.</p>

    <div class="bill-form">
        <h2>Add New Bill</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <p>{{ message }}</p>
          {% endfor %}
        {% endwith %}

        <form method="post" action="{{ url_for('add_bill') }}">
            <label for="title">Bill name</label>
            <input id="title" name="title" type="text"
                   placeholder="e.g. Electricity Bill" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="Electricity">Electricity</option>
                <option value="Water">Water</option>
                <option value="Internet">Internet</option>
                <option value="Mobile">Mobile</option>
                <option value="Rent">Rent</option>
                <option value="Vehicle">Vehicle</option>
                <option value="Insurance">Insurance</option>
                <option value="Subscription">Subscription</option>
                <option value="Other" selected>Other</option>
            </select>

            <label for="amount">Amount (₹)</label>
            <input id="amount" name="amount" type="number"
                   min="0" step="0.01" placeholder="e.g. 1200" required>

            <label for="due_date">Due date</label>
            <input id="due_date" name="due_date" type="date"
                   value="{{ today }}" required>

            <label for="recurring">Recurring bill?</label>
            <select id="recurring" name="recurring">
                <option value="No" selected>No</option>
                <option value="Yes">Yes</option>
            </select>

            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="3"
                      placeholder="Add any details"></textarea>

            <button type="submit">Save Bill</button>
        </form>

        <p><a href="{{ url_for('dashboard') }}">← Back to Dashboard</a></p>
    </div>
</body>
</html>
