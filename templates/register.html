```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create account | BillBuddy</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6fb; margin:0;
      min-height:100vh; display:grid; place-items:center; }
    .card { background:white; padding:32px; border-radius:16px;
      width:min(360px, calc(100% - 64px)); box-shadow:0 8px 30px #0001; }
    h1 { margin-top:0; color:#25345b; }
    label { display:block; margin-top:16px; font-weight:600; }
    input { box-sizing:border-box; width:100%; padding:12px; margin-top:6px;
      border:1px solid #ccd2df; border-radius:8px; }
    button { width:100%; margin-top:22px; padding:12px; border:0;
      border-radius:8px; background:#3659d9; color:white; font-weight:bold;
      cursor:pointer; }
    .message { color:#a22; margin:10px 0; }
    a { color:#3659d9; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Create your account</h1>
    <p>Start managing your bills with BillBuddy.</p>

    {% for category, message in get_flashed_messages(with_categories=true) %}
      <p class="message">{{ message }}</p>
    {% endfor %}

    <form method="POST">
      <label for="username">Username</label>
      <input id="username" name="username" required minlength="3"
             autocomplete="username">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required
             minlength="8" autocomplete="new-password">

      <button type="submit">Create account</button>
    </form>
    <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
  </main>
</body>
</html>
