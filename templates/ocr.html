
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scan a Bill | BillBuddy</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    background: #f6f7fc;
    color: #24243d;
    font-family: Inter, sans-serif;
}

.layout {
    display: flex;
    align-items: stretch;
    min-height: 100vh;
    width: 100%;
    margin: 0;
    padding: 0;
}

/* SIDEBAR */
.sidebar {
    width: 245px;
    min-width: 245px;
    flex: 0 0 245px;
    background: #17172e;
    color: white;
    padding: 28px 18px;
    display: flex;
    flex-direction: column;
}

.brand {
    font-size: 25px;
    font-weight: 800;
    letter-spacing: -1px;
    padding: 8px 12px 38px;
}

.brand span {
    color: #a998ff;
}

.nav-label {
    font-size: 10px;
    color: #8585a6;
    font-weight: 800;
    letter-spacing: 1.5px;
    padding: 0 13px;
    margin-bottom: 12px;
}

.navs {
    display: flex;
    flex-direction: column;
    gap: 4px;
}

.nav {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 13px 14px;
    border-radius: 12px;
    color: #b6b6d0;
    text-decoration: none;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    transition: background 0.2s, color 0.2s;
}

.nav:hover,
.nav.active {
    background: #302a54;
    color: white;
}

.bottom {
    margin-top: auto;
    background: #242440;
    padding: 17px;
    border-radius: 14px;
    font-size: 12px;
    color: #c3c1df;
    line-height: 1.6;
}

/* MAIN CONTENT */
.main {
    flex: 1 1 0;
    min-width: 0;
    padding: 38px clamp(24px, 3vw, 42px);
}

.eyebrow {
    font-size: 11px;
    letter-spacing: 1.5px;
    color: #8589a3;
    font-weight: 700;
}

h1 {
    font-size: 34px;
    letter-spacing: -1.2px;
    margin: 8px 0;
}

.subtitle {
    font-size: 14px;
    line-height: 1.8;
    color: #8589a3;
    margin: 8px 0 0;
    max-width: 750px;
}

.page-header {
    margin-bottom: 30px;
}

/* UPLOAD PANEL */
.scan-panel {
    width: 100%;
    max-width: none;
    background: white;
    border: 1px solid #ececf4;
    border-radius: 20px;
    padding: 34px;
    box-shadow: 0 8px 30px rgba(36, 36, 61, 0.04);
}

.panel-title {
    font-size: 21px;
    font-weight: 800;
    margin: 0 0 10px;
}

.panel-description {
    font-size: 14px;
    color: #8589a3;
    line-height: 1.8;
    margin: 0 0 26px;
}

.upload-area {
    min-height: 310px;
    border: 2px dashed #d5cdfa;
    background: linear-gradient(135deg, #faf9ff, #f7f5ff);
    border-radius: 18px;
    padding: 42px 24px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: border-color 0.2s, background 0.2s;
}

.upload-area:hover {
    border-color: #9279f5;
    background: #f7f4ff;
}

.upload-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 20px;
    display: grid;
    place-items: center;
    background: #eee9ff;
    color: #7655ef;
    border-radius: 20px;
    font-size: 34px;
}

.upload-title {
    font-size: 19px;
    font-weight: 800;
    margin-bottom: 10px;
}

.upload-help {
    color: #8589a3;
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 22px;
}

.file-input {
    display: block;
    width: 100%;
    max-width: 460px;
    margin: 0 auto 20px;
    padding: 13px;
    border: 1px solid #e4e3ef;
    border-radius: 11px;
    background: white;
    color: #555570;
    font-family: inherit;
    font-size: 13px;
}

.btn {
    display: inline-block;
    border: 0;
    background: #7655ef;
    color: white;
    text-decoration: none;
    border-radius: 11px;
    padding: 14px 24px;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s, transform 0.2s;
}

.btn:hover {
    background: #6242dc;
    transform: translateY(-1px);
}

.btn:disabled {
    opacity: 0.6;
    cursor: not-allowed;
}

.notice {
    margin-top: 22px;
    background: #f6f4ff;
    border: 1px solid #e8e2ff;
    border-radius: 13px;
    padding: 17px 19px;
    color: #62558e;
    font-size: 13px;
    line-height: 1.8;
}

/* FEATURE CARDS */
.scan-features {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 20px;
    margin-top: 26px;
}

.feature-card {
    background: white;
    border: 1px solid #ececf4;
    border-radius: 17px;
    padding: 25px;
    min-width: 0;
    box-shadow: 0 5px 20px rgba(36, 36, 61, 0.025);
    transition: transform 0.2s, box-shadow 0.2s;
}

.feature-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 10px 25px rgba(36, 36, 61, 0.06);
}

.feature-icon {
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
    background: #f0edff;
    color: #7655ef;
    border-radius: 14px;
    font-size: 23px;
    font-weight: 700;
    margin-bottom: 18px;
}

.feature-card h3 {
    font-size: 15px;
    font-weight: 800;
    margin: 0 0 10px;
}

.feature-card p {
    color: #8589a3;
    font-size: 13px;
    line-height: 1.8;
    margin: 0;
}


        <!-- SCAN RESULT -->
        {% if result %}
        <section class="result-panel">
            <h2 class="result-title">Scan result</h2>

            {% if result.filename %}
            <p><strong>File:</strong> {{ result.filename }}</p>
            {% endif %}

            {% if result.error %}
            <div class="error">
                {{ result.error }}
            </div>
            {% endif %}

            {% if result.text %}
            <p><strong>Detected amount:</strong>
                {{ result.amount if result.amount else "Not found" }}
            </p>

            <p><strong>Detected due date:</strong>
                {{ result.due_date if result.due_date else "Not found" }}
            </p>

            <label for="extracted-text"><strong>Extracted text</strong></label>

            <textarea
                id="extracted-text"
                rows="10"
                readonly
                style="width:100%; margin-top:10px; padding:14px;
                       border:1px solid #e4e3ef; border-radius:10px;
                       font-family:inherit; font-size:13px;
                       line-height:1.7; resize:vertical;"
            >{{ result.text }}</textarea>

            <div style="margin-top:20px">
                <a class="btn" href="{{ url_for('add_bill') }}">
                    + Add a bill
                </a>
            </div>
            {% endif %}
        </section>
        {% endif %}
